<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Folder Black Friday · Gabriel Distribuidora</title>
<meta name="theme-color" content="#13294b">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800;900&family=Nunito:wght@600;700;800&display=swap">
<style>
:root{--navy:#13294b;--navy2:#0b1b35;--orange:#f26b1d;--orange2:#d9560d;--ink:#13294b;--muted:#5d6b82;--line:#e6ebf2}
*{box-sizing:border-box}
body{margin:0;background:#e9edf3;color:var(--ink);font-family:"Nunito",system-ui,sans-serif;-webkit-print-color-adjust:exact;print-color-adjust:exact}
/* barra de ações (some na impressão) */
.acoes{position:sticky;top:0;z-index:10;display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:center;padding:10px 16px;background:var(--navy2);color:#fff;font:600 13px "Poppins",sans-serif}
.acoes button,.acoes a{font:inherit;border:0;border-radius:999px;padding:9px 16px;cursor:pointer;text-decoration:none;background:rgba(255,255,255,.12);color:#fff}
.acoes .pri{background:var(--orange)}
.acoes label{display:flex;gap:6px;align-items:center}
.acoes select{font:inherit;border-radius:999px;border:0;padding:7px 10px}
/* folha A4 */
.folha{width:210mm;min-height:297mm;margin:16px auto;background:#fff;box-shadow:0 10px 40px rgba(11,27,53,.18);position:relative;overflow:hidden;display:flex;flex-direction:column}
.capa{background:radial-gradient(120% 90% at 100% 0%,#24497f 0,var(--navy) 45%,var(--navy2) 100%);color:#fff;padding:12mm 12mm 9mm;position:relative}
.capa::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3mm;background:var(--orange)}
.capa .logo{width:66mm;display:block}
.capa .logo img{width:100%;display:block}
.capa h1{font:900 24mm/0.9 "Poppins",sans-serif;letter-spacing:-.5mm;margin:7mm 0 0;text-transform:uppercase}
.capa h1 span{color:var(--orange);display:block}
.capa .sub{margin-top:4mm;font:700 4.4mm "Poppins",sans-serif;display:flex;flex-wrap:wrap;gap:3mm 6mm;align-items:center}
.capa .sub b{background:var(--orange);padding:1.6mm 4mm;border-radius:999px;color:#fff}
.capa .havs{position:absolute;right:12mm;top:12mm;font:800 4mm "Poppins",sans-serif;letter-spacing:.6mm;opacity:.75;text-transform:uppercase}
.mini{background:var(--navy);color:#fff;padding:5mm 10mm;display:flex;align-items:center;justify-content:space-between;gap:6mm;border-bottom:2.5mm solid var(--orange)}
.mini img{height:13mm;width:auto;display:block}
.mini b{font:900 7mm "Poppins",sans-serif;text-transform:uppercase}.mini b span{color:var(--orange)}
.grade{flex:1;display:grid;grid-template-columns:repeat(3,1fr);gap:4mm;padding:7mm 9mm 5mm;align-content:start}
.item{border:.35mm solid var(--line);border-radius:4mm;overflow:hidden;display:flex;flex-direction:column;break-inside:avoid;background:#fff}
.item .ft{aspect-ratio:1/1;display:grid;place-items:center;position:relative;background:#fff}
.item .ft img{width:100%;height:100%;object-fit:contain}
.item .ft .sf{font:700 3mm "Poppins";color:#9aa6b8}
.item .selo{position:absolute;top:2mm;left:2mm;background:var(--navy2);color:var(--orange);font:800 2.5mm "Poppins",sans-serif;letter-spacing:.3mm;padding:1mm 2.2mm;border-radius:999px}
.item .bd{padding:2.4mm 3mm 3mm;border-top:1mm solid var(--orange);display:flex;flex-direction:column;gap:.8mm;flex:1}
.item .nm{font:800 3.7mm/1.15 "Poppins",sans-serif;color:var(--navy);text-transform:uppercase}
.item .cs{font:700 2.7mm "Nunito";color:var(--muted)}
.item .dots{display:flex;gap:1mm;margin:.6mm 0}
.item .dots img{width:6mm;height:6mm;object-fit:contain;border:.3mm solid var(--line);border-radius:1.2mm;background:#fff}
.item .pr{margin-top:auto;display:flex;align-items:baseline;gap:1.4mm;flex-wrap:wrap}
.item .pr small{font:700 2.5mm "Nunito";color:var(--muted)}
.item .pr b{font:900 6.2mm "Poppins",sans-serif;color:var(--orange2);letter-spacing:-.2mm}
.item .tm{font:700 2.4mm "Nunito";color:var(--muted)}
.rodape{background:var(--navy2);color:#fff;padding:4mm 10mm;display:flex;justify-content:space-between;align-items:center;gap:6mm;font:600 3mm "Poppins",sans-serif}
.rodape .lk{color:var(--orange);font-weight:800;word-break:break-all}
.rodape .pg{opacity:.7}
.vazio{padding:20mm;text-align:center;font:700 5mm "Poppins";color:var(--muted)}
@media print{body{background:#fff}.acoes{display:none}.folha{margin:0;box-shadow:none;page-break-after:always}@page{size:A4;margin:0}}
@media screen and (max-width:820px){.folha{zoom:calc(100vw / 840px)}}
</style>
</head>
<body>
<div class="acoes">
  <button class="pri" id="bBaixar">⬇️ Baixar PDF</button>
  <button id="bPdf">🖨️ Imprimir</button>
  <label>Produtos por folha <select id="porFolha"><option>9</option><option selected>12</option><option>15</option></select></label>
  <label><input type="checkbox" id="soFoto" checked> só com foto</label>
  <a href="./" target="_blank" rel="noopener">Ver catálogo</a>
</div>
<div id="folhas"><div class="folha"><div class="vazio">Carregando…</div></div></div>
<script>
const $=id=>document.getElementById(id);
const brl=n=>Number(n).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
// catálogo de um vendedor: /v/nome (senão, o catálogo geral)
const VEND=(location.pathname.match(/^/v/([^/]+)/)||[])[1]||'';
const urlCat=()=>VEND?'/api/catalogo?v='+encodeURIComponent(VEND):'catalogo.json?t='+Date.now();
const mini=u=>/^\/?fotos\/hd\/[^/]+\.jpg$/.test(u)?u.replace(/\.jpg$/,'-400.jpg'):u;
const hojeBR=()=>new Date(Date.now()-3*3600e3).toISOString().slice(0,10);
const dataBR=s=>s?s.slice(8,10)+'/'+s.slice(5,7):'';
let itens=[];
// logo embutida (data URL) para sair também no PDF gerado
let LOGO='logo-selo.png';
const logoPronta=fetch('logo-selo.png').then(r=>r.blob()).then(b=>new Promise(ok=>{const f=new FileReader();f.onload=()=>{LOGO=f.result;ok()};f.readAsDataURL(b)})).catch(()=>{});
// link que vai no rodapé: o endereço público por onde o folder foi aberto
const link=(location.origin+location.pathname.replace(/[^/]*$/,'')).replace(/^https?:\/\//,'').replace(/\/$/,'');
function card(i){
  const capa=i.cores.find(c=>c.foto),n=i.cores.length,tams=[...new Set(i.cores.flatMap(c=>c.tams))].filter(t=>!/grade/i.test(t)).sort((a,b)=>parseInt(a)-parseInt(b));
  const preco=i.promoMax>i.promo?`<small>a partir de</small><b>${brl(i.promo)}</b>`:`<b>${brl(i.promo)}</b><small>o par</small>`;
  return `<div class="item"><div class="ft"><span class="selo">BLACK FRIDAY</span>${capa?`<img src="${esc(mini(capa.foto))}" alt="">`:'<span class="sf">foto em breve</span>'}</div>
  <div class="bd"><div class="nm">${esc(i.produto)}</div><div class="cs">${n} ${n>1?'cores':'cor'}</div>
  ${n>1?`<div class="dots">${i.cores.filter(c=>c.foto).slice(0,6).map(c=>`<img src="${esc(mini(c.foto))}" alt="">`).join('')}</div>`:''}
  ${tams.length?`<div class="tm">Tam. ${esc(tams.slice(0,6).join(' · '))}${tams.length>6?' …':''}</div>`:''}
  <div class="pr">${preco}</div></div></div>`}
function render(){
  const por=+$('porFolha').value,L=itens.filter(i=>!$('soFoto').checked||i.cores.some(c=>c.foto));
  if(!L.length){$('folhas').innerHTML='<div class="folha"><div class="vazio">Nenhum produto em Black Friday no momento.</div></div>';return}
  const ate=L.map(i=>i.promoAte).filter(Boolean).sort().pop(),pags=Math.ceil(L.length/por);
  let h='';
  for(let p=0;p<pags;p++){
    const top=p===0?`<div class="capa"><div class="logo"><img src="${LOGO}" alt="Gabriel Distribuidora"></div><div class="havs">Havaianas</div>
      <h1>Black<span>Friday</span></h1><div class="sub"><b>Ofertas até ${dataBR(ate)}</b><span>${L.length} modelos com preço especial</span></div></div>`
      :`<div class="mini"><img src="${LOGO}" alt="Gabriel Distribuidora"><b>Black <span>Friday</span></b></div>`;
    h+=`<section class="folha">${top}<div class="grade">${L.slice(p*por,(p+1)*por).map(card).join('')}</div>
      <div class="rodape"><span>Veja todas as cores e tamanhos: <span class="lk">${esc(link)}</span></span><span class="pg">${p+1}/${pags}</span></div></section>`}
  $('folhas').innerHTML=h}
$('porFolha').onchange=render;$('soFoto').onchange=render;
$('bPdf').onclick=()=>window.print();
// baixa o PDF direto (uma página A4 por folha)
$('bBaixar').onclick=async()=>{const b=$('bBaixar'),txt=b.textContent;b.disabled=true;b.textContent='Gerando PDF…';
  try{if(!window.html2pdf)await new Promise((ok,erro)=>{const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js';s.onload=ok;s.onerror=erro;document.head.appendChild(s)});
    const alvo=$('folhas').cloneNode(true);alvo.querySelectorAll('.folha').forEach(f=>{f.style.margin='0';f.style.boxShadow='none';f.style.zoom='1';f.style.height='296.5mm';f.style.minHeight='0'});
    const caixa=document.createElement('div');caixa.style.cssText='position:fixed;left:-9999px;top:0;width:210mm';caixa.appendChild(alvo);document.body.appendChild(caixa);
    // espera todas as fotos (e a logo) carregarem antes de desenhar o PDF
    await Promise.all([...alvo.querySelectorAll('img')].map(im=>{im.loading='eager';return im.complete&&im.naturalWidth?0:new Promise(ok=>{im.onload=im.onerror=ok})}));
    await html2pdf().set({margin:0,filename:'Black-Friday-Gabriel-Distribuidora.pdf',image:{type:'jpeg',quality:.92},html2canvas:{scale:2,useCORS:true,backgroundColor:'#ffffff'},jsPDF:{unit:'mm',format:'a4',orientation:'portrait'},pagebreak:{mode:['css'],after:'.folha'}}).from(alvo).save();
    caixa.remove()}
  catch(e){alert('Não deu para gerar o PDF aqui. Use o botão Imprimir e escolha "Salvar como PDF".')}
  b.disabled=false;b.textContent=txt};
Promise.all([fetch(urlCat()).then(r=>r.json()),logoPronta]).then(([d])=>{itens=d.itens.filter(i=>(VEND?true:i.promoNome==='Black Friday')&&i.promo&&!(i.promoAte&&i.promoAte<hojeBR())).map(i=>({...i,cores:i.cores.filter(c=>c.promo>0).map(c=>({...c,tams:c.tamsPromo&&c.tamsPromo.length?c.tamsPromo:c.tams}))})).sort((a,b)=>a.produto.localeCompare(b.produto));render()})
  .catch(()=>{$('folhas').innerHTML='<div class="folha"><div class="vazio">Não foi possível carregar os produtos.</div></div>'});
</script>
</body>
</html>
